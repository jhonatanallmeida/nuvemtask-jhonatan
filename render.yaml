services:
  - type: web
    name: nuvemtask-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nuvemtask-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: https://nuvemtask-web.onrender.com,http://localhost:5173

  - type: web
    name: nuvemtask-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://nuvemtask-api.onrender.com

databases:
  - name: nuvemtask-db
    plan: free
    region: ohio
    databaseName: nuvemtask
    user: nuvemtask
